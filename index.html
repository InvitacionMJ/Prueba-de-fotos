<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba Cloudinary</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f7d3a7;
    text-align: center;
    padding: 40px;
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 12px;
    background: #c96f3a;
    color: white;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>Prueba de subida</h1>
<p>Presiona el botón y sube una foto de prueba.</p>

<button onclick="abrirSubida()">Subir foto</button>

<script>
function abrirSubida() {
    cloudinary.openUploadWidget(
        {
            cloudName: "dtssk5zhr",
            uploadPreset: "Boda_Mich_Jhovas",
            sources: ["local", "camera"],
            multiple: true,
            resourceType: "auto",
            folder: "boda_mich_jhovas/invitados",
            clientAllowedFormats: ["jpg", "jpeg", "png", "webp", "mp4"],
            maxFileSize: 20000000
        },
        function(error, result) {
            if (!error && result && result.event === "success") {
                alert("Foto subida correctamente");
                console.log(result.info);
            }

            if (error) {
                alert("Hubo un error al subir la foto");
                console.log(error);
            }
        }
    );
}
</script>

</body>
</html>
